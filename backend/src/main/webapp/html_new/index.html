<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="瘋購物後台管理系統 - 現代化的電商管理平台">
    <meta name="author" content="瘋購物團隊">
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="../html/img/icon/crazyshop.ico" type="image/x-icon">
    
    <!-- 主標題 -->
    <title>瘋購物後台管理系統 v2.0</title>

    <!-- External Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <!-- 模組化CSS -->
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="./assets/css/layout.css">
    <link rel="stylesheet" href="./assets/css/components.css">
    <link rel="stylesheet" href="./assets/css/modules.css">
</head>

<body class="admin-dashboard">
    <!-- Loading Spinner -->
    <div id="loading-spinner" class="loading-overlay">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">載入中...</span>
        </div>
    </div>

    <!-- Main Application Container -->
    <div class="app-container">
        <!-- Header Component -->
        <header id="app-header" class="app-header">
            <!-- Header content will be loaded here -->
        </header>

        <!-- Main Layout -->
        <div class="app-layout">
            <!-- Sidebar Navigation -->
            <aside id="app-sidebar" class="app-sidebar">
                <!-- Sidebar content will be loaded here -->
            </aside>

            <!-- Main Content Area -->
            <main id="app-main" class="app-main">
                <!-- Dynamic content will be loaded here -->
                <div id="main-content-area" class="content-area">
                    <!-- Default welcome content -->
                    <div class="welcome-screen">
                        <h1>歡迎使用瘋購物後台管理系統</h1>
                        <p>系統正在初始化中...</p>
                    </div>
                </div>
            </main>
        </div>

        <!-- Footer Component -->
        <footer id="app-footer" class="app-footer">
            <!-- Footer content will be loaded here -->
        </footer>
    </div>

    <!-- 通知系統 -->
    <div id="notification-container" class="notification-container">
        <!-- Notifications will be displayed here -->
    </div>

    <!-- 模態框容器 -->
    <div id="modal-container">
        <!-- Modals will be rendered here -->
    </div>

    <!-- External Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../html/js/alpine.min.js"></script>
    
    <!-- Application Scripts -->
    <script type="module" src="./shared/constants/app-config.js"></script>
    <script type="module" src="./shared/utils/helpers.js"></script>
    <script type="module" src="./shared/api/api-client.js"></script>
    <script type="module" src="./assets/js/app.js"></script>
</body>

</html>
